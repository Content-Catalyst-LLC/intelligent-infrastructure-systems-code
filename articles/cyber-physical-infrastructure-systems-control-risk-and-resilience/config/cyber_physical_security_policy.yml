cyber_physical_security_policy:
  version: "1.0.0"
  rule: "Cyber-physical infrastructure systems must protect sensors, controllers, actuators, gateways, telemetry, commands, credentials, firmware, remote access, logs, operator interfaces, and vendor pathways."
  required_elements:
    - asset_inventory
    - controller_inventory
    - actuator_inventory
    - firmware_inventory
    - credential_management
    - secure_remote_access
    - network_segmentation
    - telemetry_integrity_checks
    - command_authorization
    - audit_logging
    - incident_response
    - manual_fallback
    - recovery_testing
